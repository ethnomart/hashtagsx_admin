<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HASHTAGSX Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root { --red:#eb3324; --bg:#f5f4ee; --card:#fff; --ink:#0c0c0d; --mute:#6b6b70; --line:#e2e0d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0c0c0d; --card:#141416; --ink:#f5f0e6; --mute:#9a9aa0; --line:#26262a; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header img { height:40px; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 60px; }
  .login { max-width:340px; margin:14vh auto; padding:0 16px; text-align:center; }
  input, select, button { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button { cursor:pointer; background:var(--red); color:#fff; border:0; font-weight:600; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .login input { width:100%; margin:14px 0 10px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .stat b { display:block; font-size:24px; }
  .stat span { color:var(--mute); font-size:13px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .filters button { background:var(--card); color:var(--ink); border:1px solid var(--line); font-weight:500; padding:6px 12px; }
  .filters button.on { background:var(--red); color:#fff; border-color:var(--red); }
  .order { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .order.new { border-left:4px solid var(--red); }
  .top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center; }
  .id { font-weight:700; font-size:17px; }
  .mute { color:var(--mute); font-size:13px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px; }
  @media (max-width:640px) { .grid { grid-template-columns:1fr; } }
  ul { margin:6px 0 0; padding-left:18px; }
  .total { margin-top:8px; font-weight:700; }
  .empty { text-align:center; color:var(--mute); padding:60px 0; }
  .err { color:var(--red); min-height:20px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/config.js"></script>
<script>
const API = (window.API_URL || '').replace(/\/$/, '');
const app = document.getElementById('app');
let token = sessionStorage.getItem('hx_admin') || '';
let orders = [], filter = 'all', known = new Set(), timer;
const STATUSES = ['new', 'confirmed', 'shipped', 'delivered', 'cancelled'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + Number(n).toFixed(2);

function loginView(msg) {
  clearInterval(timer);
  app.innerHTML = '<div class="login"><img src="/logo-full.png" height="90" alt="HASHTAGSX"><h2>Admin</h2>' +
    '<input id="pw" type="password" placeholder="Admin password" autofocus>' +
    '<button id="go" style="width:100%">Sign in</button><p class="err">' + esc(msg || '') + '</p></div>';
  const go = async () => { token = document.getElementById('pw').value; await load(true); };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function api(path, opts) {
  return fetch(API + path, Object.assign({}, opts, { headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token } }));
}

async function load(first) {
  let r;
  try { r = await api('/api/orders'); } catch (e) { return loginView('Server not reachable. Is "npm run server" running?'); }
  if (r.status === 401) { sessionStorage.removeItem('hx_admin'); return loginView(first ? 'Wrong password' : 'Session expired'); }
  sessionStorage.setItem('hx_admin', token);
  orders = await r.json();
  const fresh = orders.filter(o => !known.has(o.id));
  if (known.size && fresh.length) document.title = '(' + fresh.length + ') New order - HASHTAGSX Admin';
  orders.forEach(o => known.add(o.id));
  render();
  clearInterval(timer);
  timer = setInterval(() => load(), 15000);
}

async function setStatus(id, status) {
  await api('/api/orders/' + id, { method: 'PATCH', body: JSON.stringify({ status }) });
  load();
}
window.setStatus = setStatus;

function render() {
  const revenue = orders.filter(o => o.status !== 'cancelled').reduce((a, o) => a + o.total, 0);
  const shown = filter === 'all' ? orders : orders.filter(o => o.status === filter);
  const cards = shown.map(o =>
    '<div class="order ' + esc(o.status) + '">' +
      '<div class="top"><span class="id">' + esc(o.id) + '</span>' +
        '<span class="mute">' + new Date(o.createdAt).toLocaleString() + '</span>' +
        '<select onchange="setStatus(\'' + esc(o.id) + '\', this.value)">' +
          STATUSES.map(s => '<option ' + (s === o.status ? 'selected' : '') + '>' + s + '</option>').join('') +
        '</select></div>' +
      '<div class="grid">' +
        '<div><b>' + esc(o.customer.name) + '</b><br>' +
          '<a href="tel:' + esc(o.customer.phone) + '">' + esc(o.customer.phone) + '</a>' +
          (o.customer.email ? '<br><a href="mailto:' + esc(o.customer.email) + '">' + esc(o.customer.email) + '</a>' : '') +
          '<div class="mute" style="margin-top:6px">' + esc(o.customer.address) + ', ' + esc(o.customer.city) + '</div>' +
          (o.customer.notes ? '<div class="mute" style="margin-top:6px">Note: ' + esc(o.customer.notes) + '</div>' : '') +
        '</div>' +
        '<div><ul>' + o.items.map(i => '<li>' + esc(i.title) + ' / ' + esc(i.size) + ' x ' + i.quantity +
          ' <span class="mute">' + money(i.price * i.quantity) + '</span></li>').join('') + '</ul>' +
          '<div class="total">' + money(o.total) + ' <span class="mute">(shipping ' + money(o.shipping) +
          ', discount ' + money(o.discount) + ') ' + esc(o.payment) + '</span></div></div>' +
      '</div></div>').join('');
  app.innerHTML =
    '<header><img src="/logo-full.png" alt="HASHTAGSX"><div><span class="mute">Refreshes every 15s</span> <button class="ghost" id="out">Sign out</button></div></header>' +
    '<main><div class="stats">' +
      '<div class="stat"><b>' + orders.length + '</b><span>Total orders</span></div>' +
      '<div class="stat"><b>' + orders.filter(o => o.status === 'new').length + '</b><span>New, need action</span></div>' +
      '<div class="stat"><b>' + money(revenue) + '</b><span>Revenue (excl. cancelled)</span></div></div>' +
    '<div class="filters">' + ['all'].concat(STATUSES).map(s => '<button class="' + (filter === s ? 'on' : '') + '" data-f="' + s + '">' + s + '</button>').join('') + '</div>' +
    (cards || '<div class="empty">No orders here yet.</div>') + '</main>';
  document.getElementById('out').onclick = () => { sessionStorage.removeItem('hx_admin'); token = ''; known.clear(); loginView(); };
  document.querySelectorAll('[data-f]').forEach(b => { b.onclick = () => { filter = b.dataset.f; render(); }; });
}

if (token) load(); else loginView();
</script>
</body>
</html>
